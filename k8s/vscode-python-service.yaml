# Service Onyxia utilise pour executer le pipeline (namespace user-m-lali-ece)
# Equivalent Helm :
#   helm repo add ide https://inseefrlab.github.io/helm-charts-interactive-services
#   helm install vscode-python ide/vscode-python --version 2.6.6 -n user-m-lali-ece -f vscode-python-service.yaml
# Objets Kubernetes crees par le chart (kubectl get statefulset,svc,ingress,pvc) :
#   statefulset.apps/vscode-python-213939, service/vscode-python-213939 (ClusterIP, 8080/TCP),
#   ingress vscode-python-213939-ui (nginx), persistentvolumeclaim/vscode-python-213939 (10Gi, ceph-block)
service:
  image:
    version: inseefrlab/onyxia-vscode-python:py3.13.15
resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    cpu: "2"
    memory: 2000Mi
persistence:
  enabled: true
  size: 10Gi
kubernetes:
  enabled: true
s3:
  enabled: true
  endpoint: s3.seaweedfs.adm.adaltas.cloud
  defaultRegion: us-east-1
  pathStyleAccess: true
  # accessKeyId / secretAccessKey / sessionToken : injectes par Onyxia, jamais versionnes
